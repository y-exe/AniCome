name: Release
run-name: v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (for example 0.25.1)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Commit version with GitHub signature
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release/prepare-release.py "$RELEASE_VERSION"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64, universal, fdroid-universal]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
      - name: Build and validate
        env:
          ABI: ${{ matrix.abi }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ "$ABI" = fdroid-universal ]; then
            flags=(-Pfdroid=true)
          elif [ "$ABI" = universal ]; then
            flags=()
          else
            flags=(-PtargetAbi="$ABI")
          fi
          ./gradlew :app:assembleRelease :app:auditTranslations "${flags[@]}" --console=plain
          mkdir -p artifacts
          apk="artifacts/AniCome-v${VERSION}-${ABI}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee artifacts/signature.txt
          test -n "$EXPECTED_CERTIFICATE"
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERTIFICATE" artifacts/signature.txt
          "$tools/zipalign" -c -P 16 4 "$apk"
          python tests/packaging/test-apk-validation.py
          python scripts/checks/check-apk.py "$apk" > artifacts/validation.json
          python scripts/checks/check-bundled-preview.py "$apk"
          "$tools/aapt" dump badging "$apk" > artifacts/package.txt
          head -1 artifacts/package.txt
          python tests/storage/test-library-migrations.py
          (cd artifacts && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-${{ matrix.abi }}
          path: artifacts/*
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: apk-*
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          find artifacts -name '*.apk' -exec cp {} . \;
          sha256sum ./*.apk > SHA256SUMS
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" ./*.apk SHA256SUMS --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v$VERSION" -f sha="$RELEASE_SHA" -F force=true
            gh release edit "v$VERSION" --target "$RELEASE_SHA" --title "AniCome v$VERSION" --prerelease="$PRERELEASE"
          else
            gh release create "v$VERSION" ./*.apk SHA256SUMS --target "$RELEASE_SHA" --title "AniCome v$VERSION" --generate-notes "${flags[@]}"
          fi
